name: Check and package

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Release tag must match package.json version");'
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Save the tested Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: samsara-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30
